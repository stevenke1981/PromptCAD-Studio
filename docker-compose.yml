services:
  promptcad:
    build: .
    ports:
      - "${PROMPTCAD_BIND_ADDRESS:-127.0.0.1}:${PROMPTCAD_PORT:-8000}:8000"
    environment: &promptcad-environment
      PROMPTCAD_ENV: "${PROMPTCAD_ENV:-production}"
      PROMPTCAD_DATA_DIR: /app/generated
      PROMPTCAD_PLANNER_MODE: "${PROMPTCAD_PLANNER_MODE:-auto}"
      PROMPTCAD_RENDER_BACKEND: "${PROMPTCAD_RENDER_BACKEND:-auto}"
      PROMPTCAD_ALLOW_SOURCE_FALLBACK: "${PROMPTCAD_ALLOW_SOURCE_FALLBACK:-true}"
      PROMPTCAD_RENDER_TIMEOUT_SECONDS: "${PROMPTCAD_RENDER_TIMEOUT_SECONDS:-120}"
      PROMPTCAD_RENDER_CONCURRENCY: "${PROMPTCAD_RENDER_CONCURRENCY:-2}"
      PROMPTCAD_MAX_RENDER_ARTIFACT_BYTES: "${PROMPTCAD_MAX_RENDER_ARTIFACT_BYTES:-200000000}"
      PROMPTCAD_MAX_RENDER_TOTAL_BYTES: "${PROMPTCAD_MAX_RENDER_TOTAL_BYTES:-500000000}"
      PROMPTCAD_MAX_RENDERER_OUTPUT_CHARS: "${PROMPTCAD_MAX_RENDERER_OUTPUT_CHARS:-100000}"
      PROMPTCAD_MAX_PROMPT_CHARS: "${PROMPTCAD_MAX_PROMPT_CHARS:-4000}"
      PROMPTCAD_MAX_JOBS_RETURNED: "${PROMPTCAD_MAX_JOBS_RETURNED:-50}"
      PROMPTCAD_MAX_IMAGE_BYTES: "${PROMPTCAD_MAX_IMAGE_BYTES:-10000000}"
      PROMPTCAD_MAX_IMAGE_PIXELS: "${PROMPTCAD_MAX_IMAGE_PIXELS:-12000000}"
      PROMPTCAD_MAX_IMAGE_DIMENSION: "${PROMPTCAD_MAX_IMAGE_DIMENSION:-4096}"
      PROMPTCAD_MAX_PDF_PAGES: "${PROMPTCAD_MAX_PDF_PAGES:-20}"
      PROMPTCAD_IMAGE_ANALYSIS_TIMEOUT_SECONDS: "${PROMPTCAD_IMAGE_ANALYSIS_TIMEOUT_SECONDS:-20}"
      PROMPTCAD_IMAGE_ANALYSIS_CONCURRENCY: "${PROMPTCAD_IMAGE_ANALYSIS_CONCURRENCY:-2}"
      PROMPTCAD_MAX_DXF_BYTES: "${PROMPTCAD_MAX_DXF_BYTES:-5000000}"
      PROMPTCAD_MAX_DXF_ENTITIES: "${PROMPTCAD_MAX_DXF_ENTITIES:-2000}"
      PROMPTCAD_MAX_DXF_SEGMENTS: "${PROMPTCAD_MAX_DXF_SEGMENTS:-256}"
      PROMPTCAD_MAX_DXF_HOLES: "${PROMPTCAD_MAX_DXF_HOLES:-64}"
      PROMPTCAD_DXF_ANALYSIS_TIMEOUT_SECONDS: "${PROMPTCAD_DXF_ANALYSIS_TIMEOUT_SECONDS:-20}"
      PROMPTCAD_DXF_ANALYSIS_CONCURRENCY: "${PROMPTCAD_DXF_ANALYSIS_CONCURRENCY:-2}"
      PROMPTCAD_MAX_FEATURE_TREE_BODY_BYTES: "${PROMPTCAD_MAX_FEATURE_TREE_BODY_BYTES:-1000000}"
      PROMPTCAD_FEATURE_TREE_CONCURRENCY: "${PROMPTCAD_FEATURE_TREE_CONCURRENCY:-4}"
      PROMPTCAD_MAX_GENERATE_BODY_BYTES: "${PROMPTCAD_MAX_GENERATE_BODY_BYTES:-2000000}"
      PROMPTCAD_GENERATE_CONCURRENCY: "${PROMPTCAD_GENERATE_CONCURRENCY:-4}"
      PROMPTCAD_ASYNC_QUEUE_MAX_PENDING: "${PROMPTCAD_ASYNC_QUEUE_MAX_PENDING:-100}"
      PROMPTCAD_ASYNC_QUEUE_LEASE_SECONDS: "${PROMPTCAD_ASYNC_QUEUE_LEASE_SECONDS:-300}"
      PROMPTCAD_ASYNC_QUEUE_MAX_ATTEMPTS: "${PROMPTCAD_ASYNC_QUEUE_MAX_ATTEMPTS:-2}"
      PROMPTCAD_WORKER_POLL_SECONDS: "${PROMPTCAD_WORKER_POLL_SECONDS:-0.5}"
      PROMPTCAD_API_TOKEN: "${PROMPTCAD_API_TOKEN:-}"
      PROMPTCAD_CORS_ORIGINS: "${PROMPTCAD_CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}"
      PROMPTCAD_LLM_BASE_URL: "${PROMPTCAD_LLM_BASE_URL:-https://api.openai.com/v1}"
      PROMPTCAD_LLM_API_KEY: "${PROMPTCAD_LLM_API_KEY:-}"
      PROMPTCAD_LLM_MODEL: "${PROMPTCAD_LLM_MODEL:-gpt-5.6}"
      PROMPTCAD_LLM_STRUCTURED_MODE: "${PROMPTCAD_LLM_STRUCTURED_MODE:-json_schema}"
      PROMPTCAD_LLM_TIMEOUT_SECONDS: "${PROMPTCAD_LLM_TIMEOUT_SECONDS:-90}"
      PROMPTCAD_LLM_MAX_RETRIES: "${PROMPTCAD_LLM_MAX_RETRIES:-1}"
      PROMPTCAD_LLM_FALLBACK_TO_RULE: "${PROMPTCAD_LLM_FALLBACK_TO_RULE:-true}"
    volumes:
      - ./generated:/app/generated
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3).read(1)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  promptcad-worker:
    build: .
    command: ["promptcad-worker"]
    environment: *promptcad-environment
    volumes:
      - ./generated:/app/generated
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
