evaluated_at: 2026-07-31
autonomy: recommend_only
selected: Manufacturing drawing and approval workflow
evidence:
  - Phase 6 accepted the durable queue, independent worker, cancellation, reload recovery, and hardened single-host container profile.
  - Existing drawing PDF is an orthographic draft and explicitly lacks tolerances, datums, surface finish, BOM, and manufacturing sign-off.
  - The original CAD Agent outcome requires outputs that can enter a controlled engineering review process, not only geometry generation.
scope_candidate:
  - Typed drawing metadata for dimensions, datums, tolerances, surface finish, and title block
  - BOM and revision records for parts and future assemblies
  - Draft, reviewed, approved, and rejected lifecycle with immutable approval provenance
  - PDF generation and validation gates that distinguish a draft from approved manufacturing output
reason_not_implemented: Approval identity, signature policy, tolerance standards, and legal responsibility are product and governance decisions that require the owner's explicit choices.
