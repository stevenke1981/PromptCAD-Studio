updated_at: 2026-08-01
version: 0.8.0
architecture:
  input_paths:
    - prompt via REST, CLI, or Web
    - calibrated photo, sketch, whiteboard, patent, scan, PNG/JPEG, or selected PDF page via reviewed image Feature Tree
    - restricted DXF via reviewed DXF Feature Tree
    - manually edited CadDocument 1.0, 1.1, or 1.2
  planning:
    contract: planner capabilities expose id, version, availability, input kind, and description
    implementations:
      - standard-agent
      - rule
      - llm
  canonical_model:
    name: CadDocument
    schema_versions: ["1.0", "1.1", "1.2"]
    rules:
      - extra fields forbidden
      - units normalized to millimeters
      - bounded values and feature counts
      - design validation blocks all CAD runtime execution on error
  backend_contract:
    version: "1.0"
    registry: closed server-owned static allowlist
    request_boundary:
      - accepts only registered short backend IDs
      - rejects import paths, executables, arguments, environments, and plugin metadata
    selection_surfaces:
      - REST backend field
      - CLI --backend
      - Web CAD backend selector
    reporting:
      - GET /api/v1/capabilities
      - promptcad capabilities
      - backend-report.json
      - manifest backend diagnostics and format results
  backends:
    cadquery:
      source: model.py
      execution: local_process
      server_formats: [step, stl, dxf, svg]
      auto_eligible: true
    build123d:
      source: model.build123d.py
      execution: opt_in_local_process
      server_formats: [step, stl]
      auto_eligible: false
      environment: separate venv from CadQuery because OCP distributions conflict
    freecad:
      source: model.freecad.py
      execution: never_on_server
      server_formats: []
      host_runtime_tested: false
    openscad:
      source: model.scad
      execution: local_process
      server_formats: [stl]
      auto_eligible: true
      semantic_fidelity: approximated
    fusion360:
      source: model.fusion360.py
      execution: host_application_only
      server_formats: []
      input_bridge: sibling model.step
      host_runtime_tested: false
    solidworks:
      source: model.solidworks.py
      execution: host_application_only
      server_formats: []
      input_bridge: sibling model.step
      host_runtime_tested: false
  fallback:
    auto: [cadquery, openscad, source_only]
    explicit_unavailable_with_fallback: [requested_backend, source_only]
    desktop_adapter_bridge: [requested_host_adapter, cadquery_or_build123d, source_only]
    fail_closed_cases:
      - design validation error
      - unknown backend ID
      - OpenSCAD fillet or chamfer semantic loss
      - missing runtime when source fallback is disabled
  provenance:
    spec_hash: canonical JSON SHA-256
    source_hash: SHA-256 per generated backend source
    artifact_hash: SHA-256 per manifest artifact
    records:
      - backend capability snapshot
      - requested, selected, and effective backend
      - fallback chain
      - per-format produced, unavailable, failed, or source-only result
  runtime_controls:
    - request body and concurrency limits before JSON or multipart parsing
    - fixed renderer concurrency and timeout
    - shell false and fixed command arrays
    - private staging, HOME, and TEMP
    - child environment allowlist
    - console, single-artifact, and total-artifact limits
    - bounded stdout and stderr while the child is running
    - renderer process-tree termination on timeout or output overflow
    - path, symlink, and output signature verification before atomic promotion
  image_ingestion:
    formats: [PNG, JPEG, PDF]
    content_profiles: [auto, photo, sketch, whiteboard, patent, scan]
    pdf_runtime: pypdfium2 with serialized native access
    controls:
      - compressed byte, page count, dimension, and decoded pixel limits
      - zero-based explicit page selection
      - optional four-corner perspective correction for rectangular plates
      - ambiguous uncorrected convex quadrilaterals fail closed
      - bounded object and view candidates are visible and require explicit object_index when ambiguous
      - line-art contours produce provenance-tagged candidates with diameter uncertainty and duplicate suppression
      - outlined-circle candidates never enter CAD until explicitly accepted because annotations can resemble holes
      - arbitrary closed polygon profiles compile to CadDocument 1.1
      - source bytes and untrusted filenames are never persisted as job artifacts
  dxf_ingestion:
    operations: [auto, extrude, revolve]
    revolution_signal: exactly one horizontal or vertical CENTER layer or linetype
    feature_tree_semantics: [profile, extrusion, revolution, circle_hole, linear_pattern, circular_pattern, fillet, chamfer]
    controls:
      - parser runs in a bounded one-shot worker
      - profile must be one closed planar loop or CENTER-closed half-profile
      - revolution profile must touch and remain on one side of the axis
      - patterns require at least three equal-radius, equally spaced circles
      - edge treatments require a globally uniform rounded or chamfered rectangle
      - HMAC provenance and human confirmation remain mandatory
  async_execution:
    queue: SQLite WAL at data_dir/.queue/promptcad.sqlite3
    job_kinds: [prompt, spec]
    states: [queued, running, completed, failed, cancelled]
    delivery: atomic claim with lease, heartbeat, bounded retry, and crash recovery
    cancellation: durable request flag and cooperative renderer process-tree termination
    result_contract: existing JobManifest referenced by result_job_id
    clients:
      - async REST endpoints
      - CLI async-generate, async-render, and queue commands
      - Web background mode with reload recovery
    sandbox_profile:
      api_renderer: source_only
      worker_network: none
      root_filesystem: read_only
      controls: [cap_drop_all, no_new_privileges, cpu, memory, pids]
  manufacturing_package:
    geometry_contract: immutable CadDocument hash
    drawing_contract: ManufacturingDrawingSpec 1.0
    schedules: [dimensions, tolerances, datums, surface_finish, bom, title_block, revisions]
    lifecycle: [draft, in_review, approved, rejected]
    persistence:
      - original geometry, drawing spec, and draft PDF are SHA-256 bound
      - each transition appends a new drawing spec, searchable PDF, and review snapshot
      - expected_version prevents stale updates and approved or rejected states are terminal
      - filesystem claim provides cross-process exclusion with a bounded recovery lease
      - state snapshot is the transaction commit record and expired partial derivatives are recoverable
    clients: [REST, CLI, Web, async_worker]
    assurance: reviewer identity is self-asserted workflow metadata, not a legal or cryptographic signature
  public_deployment_boundary:
    required:
      - isolated renderer worker
      - no outbound network
      - non-root or low-privilege account
      - read-only root filesystem
      - cgroup and seccomp or platform-equivalent OS sandbox
      - authentication, TLS, rate limits, tenant quotas, and retention policy
    current_status: single-host hardened worker profile implemented; production multi-tenant policy remains deployment-owned
accepted_evidence:
  - 219 pytest tests passed with 84 percent app coverage across all accepted stages
  - Patent multi-view Web flow required explicit selection and emitted real CadQuery output with zero console errors
  - Manufacturing Web flow persisted draft, submit, and approval states with zero console errors
  - CadQuery emitted and read back a valid profile-revolution STEP
  - CadQuery, Build123d, FreeCAD, and OpenSCAD revolution sources passed focused tests
  - 153 pytest tests passed across Phase 1 through Phase 6 with 81 percent app coverage
  - Selected PDF page and arbitrary polygon image flows passed real CLI and Edge Web acceptance
  - Durable Web and CLI queue flows completed through an independent worker and existing manifest contract
  - Phase 6 code review approved with zero remaining findings
  - 128 pytest tests passed across Phase 1 through Phase 5 with 81 percent app coverage
  - CadQuery job emitted six sources, backend report, hashes, and format results
  - Build123d separate environment emitted a valid 80 x 40 x 5 mm STEP
  - Build123d STEP contains two cylindrical faces with radius 3.3 mm
  - Fusion 360 Web flow packaged its source with a validated neutral STEP and zero console errors
  - desktop host adapters are never server-executed
