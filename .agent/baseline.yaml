id: BASELINE-20260731-009
status: passed
accepted_features:
  - Natural-language planning to CadDocument 1.0
  - Plate, cylinder, ring, L bracket, and open enclosure bases
  - Hole, fillet, chamfer, and rectangular enclosure side-cutout features
  - CadQuery STEP, STL, DXF, and SVG output
  - OpenSCAD fallback
  - Dependency-free A4 orthographic drawing PDF
  - Standards-aware NEMA17 CAD Agent with provenance and overrides
  - Calibrated PNG, JPEG, and selected PDF-page extraction
  - Rectangles, arbitrary closed polygon profiles, and circular-hole extraction
  - Opt-in four-corner perspective correction with ambiguous default rejection
  - Typed editable image Feature Tree with explicit review before rendering
  - Restricted ASCII and binary DXF closed-profile and circular-hole extraction
  - CadDocument 1.1 profile extrusion with analytic line and three-point arc segments
  - Typed editable DXF Feature Tree with explicit review before rendering
  - CadDocument 1.2 profile revolution around global Z
  - DXF CENTER-axis revolution, linear and circular hole patterns, and conservative global fillet or chamfer inference
  - Deterministic CadQuery, Build123d, FreeCAD, and OpenSCAD revolution sources
  - Closed CadBackend registry and capability contract 1.0
  - Deterministic CadQuery, Build123d, FreeCAD, OpenSCAD, Fusion 360, and SOLIDWORKS sources
  - Selectable backend in REST API, CLI, and Web
  - Build123d opt-in STEP and STL runner
  - Neutral STEP packaging for Fusion 360 and SOLIDWORKS host adapters
  - Post-execution backend provenance, fallback diagnostics, and artifact hashes
  - Durable asynchronous prompt and edited-spec queue with independent worker
  - Atomic claim, lease, heartbeat, bounded retry, crash recovery, and cancellation
  - REST, CLI, and Web queue clients with reload recovery and result manifest linkage
  - Hardened no-network Docker worker deployment profile
critical_user_flows:
  - Chinese prompt to validated DSL and downloadable artifacts
  - Edited DSL to regenerated artifacts
  - Invalid geometry blocked before CAD kernel execution
  - Calibrated top-view image to reviewed Feature Tree and downloadable CAD artifacts
  - Selected PDF page to reviewed Feature Tree and CAD preview
  - Arbitrary closed image contour to CadDocument 1.1 profile extrusion
  - Bounded DXF to reviewed Feature Tree and downloadable CAD artifacts
  - CENTER half-profile DXF to reviewed revolution Feature Tree, preview, and downloadable CAD artifacts
  - Selected desktop adapter to validated neutral STEP and downloadable host bundle
  - Background prompt to durable queue, independent worker, and downloadable artifacts
  - Reloaded Web session to recovered queue status and safe cancellation
protected_behavior:
  - Unknown DSL fields are rejected
  - Generated code is deterministic and does not execute prompt text
  - Source-only mode never fabricates CAD-kernel outputs
  - Untrusted uploaded filenames and raw images are not stored as job artifacts
  - Raw DXF bytes and untrusted DXF filenames are not stored as job artifacts
  - Unsupported or ambiguous DXF geometry is blocked before CAD rendering
  - Backend IDs are selected from a closed server allowlist
  - Missing or invalid renderer outputs cannot be reported as completed
  - Exact backends cannot silently omit requested fillets or chamfers
  - OpenSCAD source is skipped rather than emitted when finishing semantics would be lost
  - Only the lease-owning worker can publish a queue transition
  - A cancellation that wins before terminal publication cannot expose a completed manifest
  - Missing or unauthorized queue polling does not permanently lock Web controls or discard recoverable state
public_interfaces:
  - CadDocument schema_version 1.0
  - CadDocument schema_version 1.1 profile_extrusion
  - CadDocument schema_version 1.2 profile_revolution
  - REST API under /api/v1
  - promptcad generate, image, dxf, validate, render, and doctor
  - POST /api/v1/image-analysis
  - POST /api/v1/image-feature-tree-to-spec
  - POST /api/v1/generate-from-image-feature-tree
  - POST /api/v1/dxf-analysis
  - POST /api/v1/dxf-feature-tree-to-spec
  - POST /api/v1/generate-from-dxf-feature-tree
  - GET /api/v1/capabilities backend and planner contracts
  - backend selection on generation endpoints and CLI commands
  - POST /api/v1/async/generate
  - POST /api/v1/async/generate-from-spec
  - GET /api/v1/async/jobs and /api/v1/async/jobs/{queue_job_id}
  - POST /api/v1/async/jobs/{queue_job_id}/cancel
  - promptcad async-generate, async-render, queue-list, queue-status, and queue-cancel
  - promptcad-worker
data_compatibility:
  - Existing CadDocument 1.0 files without cutouts remain valid
  - CadDocument 1.1 is required only for profile_extrusion
  - CadDocument 1.2 is required only for profile_revolution; 1.2 also accepts profile_extrusion
environment:
  - Windows PowerShell
  - Python 3.12.13
  - CadQuery 2.8.0
known_limitations:
  - Drawing PDF is a dimensioned draft, not a complete manufacturing drawing
  - Physical thread geometry is not generated
  - Docker, OpenSCAD executable, and Conda paths were not run locally
  - Hardened Compose YAML passed static validation but Docker runtime was unavailable locally
  - Image extraction requires one high-contrast closed part, an explicit real-world longest-edge calibration, and user-supplied thickness
  - Line and arc reconstruction, occlusion, reflection, scale OCR, multiple parts, and multi-view inference require future modes
  - DXF extraction supports one closed 2D modelspace profile or one CENTER-closed half-profile
  - Revolution first slice does not accept holes, cutouts, fillets, or chamfers
  - DXF blocks, annotations as geometry, multiple profiles, dimensions, partial arrays, and multi-view inference are not converted
