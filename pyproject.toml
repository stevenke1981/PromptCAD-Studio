[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "promptcad-studio"
version = "0.4.0"
description = "Prompt-to-parametric-CAD studio with a validated CAD DSL and multi-backend source compilers"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "PromptCAD Studio contributors" }]
keywords = ["cad", "cadquery", "openscad", "ai", "fastapi", "parametric"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.40,<1",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.14,<3",
  "httpx>=0.28,<1",
  "numpy>=2,<3",
  "opencv-python-headless>=4.12,<5",
  "pillow>=11,<13",
  "python-multipart>=0.0.20,<1",
  "ezdxf>=1.4.4,<2",
]

[project.optional-dependencies]
cad = ["cadquery==2.8.0"]
build123d = ["build123d==0.11.1"]
dev = [
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
promptcad = "app.cli:main"
promptcad-worker = "app.worker:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "generated", "examples/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
