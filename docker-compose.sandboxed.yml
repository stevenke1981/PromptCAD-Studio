services:
  promptcad:
    environment:
      PROMPTCAD_RENDER_BACKEND: source_only
      PYTHONDONTWRITEBYTECODE: "1"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2

  promptcad-worker:
    environment:
      PROMPTCAD_PLANNER_MODE: rule
      PROMPTCAD_RENDER_BACKEND: auto
      PYTHONDONTWRITEBYTECODE: "1"
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
